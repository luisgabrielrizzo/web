backend:
  name: github
  repo: luisgabrielrizzo/web
  branch: main
  app_id: "Ov23liodKoSvCAvxfOT3"
media_folder: "public/uploads"
public_folder: "/uploads"
collections:
  - name: "blog"
    label: "Artículos del Blog"
    folder: "src/pages/articulos"
    extension: "md"
    create: true
    fields:
      - {label: "No Tocar", name: "layout", widget: "hidden", default: "../../layouts/PlantillaBlog.astro"}
      - {label: "Título del Artículo", name: "title", widget: "string"}
      - {label: "Fecha", name: "date", widget: "string", default: "Octubre 2026"}
      - {label: "Imagen de Portada", name: "image", widget: "image"}
      - {label: "Contenido", name: "body", widget: "markdown"}